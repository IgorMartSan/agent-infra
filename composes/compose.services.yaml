services:
  py-agent-gateway-api:
    build:
      context: ..
      dockerfile: services/apis/py-agent-gateway-api/Dockerfile
    container_name: py-agent-gateway-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../services/apis/py-agent-gateway-api/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      RABBITMQ_VHOST: /
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - agent_platform_network

  worker-agent:
    build:
      context: ..
      dockerfile: services/jobs/py-simple-agent-job/Dockerfile
    restart: unless-stopped
    env_file:
      - ../services/jobs/py-simple-agent-job/.env

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent_platform_network

  chatbot-next:
    build:
      context: ..
      dockerfile: services/frontend/chatbot-next/Dockerfile
      args:
        NEXT_PUBLIC_CHAT_SEND_URL: ${NEXT_PUBLIC_CHAT_SEND_URL:-http://192.168.15.15:8000}
        NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:-ws://192.168.15.15:8000/ws}
    restart: unless-stopped
    working_dir: /app
    command: npm run start -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - py-agent-gateway-api
    networks:
      - agent_platform_network


networks:
  agent_platform_network:
    name: agent_platform_network
