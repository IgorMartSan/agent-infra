services:
  py-agent-gateway-api:
    build:
      context: ..
      dockerfile: services/apis/py-agent-gateway-api/Dockerfile
    container_name: py-agent-gateway-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../services/apis/py-agent-gateway-api/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      RABBITMQ_VHOST: /
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - agent_platform_network

  worker-agent:
    build:
      context: ..
      dockerfile: services/jobs/py-simple-agent-job/Dockerfile
    restart: unless-stopped
    env_file:
      - ../services/jobs/py-simple-agent-job/.env

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent_platform_network

  worker-gemma4-agent:
    build:
      context: ..
      dockerfile: services/jobs/py-gemma4-agent-job/Dockerfile
    container_name: worker-gemma4-agent
    restart: unless-stopped
    environment:
      AGENT_ID: gemma4-agent
      LOG_LEVEL: INFO
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      RABBITMQ_VHOST: /
      RABBITMQ_EXCHANGE: agent.requests
      RABBITMQ_QUEUE: agent.gemma4.requests
      RABBITMQ_ROUTING_KEY: agent.gemma4
      RABBITMQ_PREFETCH_COUNT: 1
      RABBITMQ_CONNECTION_ATTEMPTS: 1
      RABBITMQ_RETRY_DELAY: 1
      RABBITMQ_SOCKET_TIMEOUT: 5
      RABBITMQ_RECONNECT_DELAY: 3
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ""
      REDIS_RESPONSE_CHANNEL_PREFIX: chat:response
      OPENAI_BASE_URL: http://10.247.168.43:8072/v1
      OPENAI_API_KEY: EMPTY
      OPENAI_MODEL: gemma4
      OPENAI_TEMPERATURE: 0.2
      OPENAI_MAX_TOKENS: 1024
      OPENAI_TIMEOUT_SECONDS: 120
      OPENAI_MAX_RETRIES: 2
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent_platform_network

  worker-sql-agent:
    build:
      context: ..
      dockerfile: services/jobs/py-sql-agent-job/Dockerfile
    container_name: worker-sql-agent
    restart: unless-stopped
    env_file:
      - ../services/jobs/py-sql-agent-job/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent_platform_network

  chatbot-next:
    build:
      context: ..
      dockerfile: services/frontend/chatbot-next/Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: npm run start -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      CHAT_API_URL: http://py-agent-gateway-api:8000
      CHAT_REDIS_URL: redis://redis:6379/0
    depends_on:
      py-agent-gateway-api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - agent_platform_network


networks:
  agent_platform_network:
    name: agent_platform_network
