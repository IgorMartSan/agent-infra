# A mesma imagem executa um agente por processo, selecionado por AGENT_ID.
x-agent-worker: &agent-worker
  build:
    context: ..
    dockerfile: services/jobs/py-agent-job/Dockerfile
  restart: unless-stopped
  environment:
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  depends_on:
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - agent_platform_network

services:
  py-agent-gateway-api:
    build:
      context: ..
      dockerfile: services/apis/py-agent-gateway-api/Dockerfile
    container_name: py-agent-gateway-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../services/apis/py-agent-gateway-api/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      RABBITMQ_VHOST: /
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent_platform_network

  agent-rsa:
    <<: *agent-worker
    container_name: agent-rsa
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
    env_file:
      - ../services/jobs/py-agent-job/.env.rsa

  agent-simple:
    <<: *agent-worker
    container_name: agent-simple
    env_file:
      - ../services/jobs/py-agent-job/.env.simple

  agent-argus:
    <<: *agent-worker
    container_name: agent-argus
    env_file:
      - ../services/jobs/py-agent-job/.env.argus

  chatbot-next:
    build:
      context: ..
      dockerfile: services/frontend/chatbot-next/Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: npm run start -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      CHAT_API_URL: http://py-agent-gateway-api:8000
      CHAT_REDIS_URL: redis://redis:6379/0
    depends_on:
      py-agent-gateway-api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - agent_platform_network

networks:
  agent_platform_network:
    name: agent_platform_network
