  #     - ai_shop_assistant_network

  n8n:
    image: n8nio/n8n:1.123.37
    restart: always
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres_n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: postgres123
      N8N_BASIC_AUTH_ACTIVE: true
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin123
      N8N_SECURE_COOKIE: false
      N8N_HOST: n8n.local
      N8N_PORT: 5678
      #WEBHOOK_URL: http://host.docker.internal:50001
      WEBHOOK_URL: http://n8n:5678
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true

    ports:
      - "50003:5678"
    depends_on:
      - postgres_n8n
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files
    networks:
      - ai_shop_assistant_network


volumes:
  redis_n8n_data:
  postgres_n8n_data:
  postgres_test_n8n_data:
  postgres_n8n_init:
  pgadmin_n8n_data:
  n8n_data:
  n8n_files:
  waha_sessions:
  waha_media:

networks:
  ai_shop_assistant_network:
    name: ai_shop_assistant_network
