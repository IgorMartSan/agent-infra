
services:
#50000-50030
  redis_n8n:
    image: redis:7-alpine
    ports:
      - "50011:6379"
    volumes:
      - redis_n8n_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - ai_shop_assistant_network

  postgres_n8n:
    image: postgres:15.2-alpine
    restart: always
    ports:
      - "50012:5432"
    environment:
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: n8n_db
      TZ: America/Sao_Paulo
      PGDATA: /var/lib/postgresql/data/pgdata
    command: postgres -c listen_addresses='*'
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
      - postgres_n8n_init:/docker-entrypoint-initdb.d:ro
    networks:
      - ai_shop_assistant_network

  postgres_test_n8n:
    image: postgres:15.2-alpine
    restart: always
    ports:
      - "50013:5432"
    environment:
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: n8n_db
      TZ: America/Sao_Paulo
      PGDATA: /var/lib/postgresql/data/pgdata
    command: postgres -c listen_addresses='*'
    volumes:
      - postgres_test_n8n_data:/var/lib/postgresql/data
      - postgres_n8n_init:/docker-entrypoint-initdb.d:ro
    networks:
      - ai_shop_assistant_network

  pgadmin_n8n:
    image: dpage/pgadmin4:9.3
    restart: always
    user: "0:0"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@n8n.localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    ports:
      - "50014:80"
    depends_on:
      - postgres_n8n
      - postgres_test_n8n
    volumes:
      - pgadmin_n8n_data:/var/lib/pgadmin
    networks:
      - ai_shop_assistant_network



