  #   image: devlikeapro/waha
  #   platform: linux/amd64    
  #   environment:      
  #      #WHATSAPP_HOOK_URL: http://n8n:5678/webhook-test/webhook  
  #      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/webhook  
  #      WAHA_DASHBOARD_ENABLED: "true"
