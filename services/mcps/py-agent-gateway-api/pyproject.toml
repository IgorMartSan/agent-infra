[project]
name = 'py-agent-gateway-api'
version = '0.1.0'
description = 'FastAPI gateway for publishing agent messages to RabbitMQ'
requires-python = '>=3.10'
dependencies = [
    'asyncpg>=0.30.0',
    'fastapi>=0.115.3',
    'pika>=1.3.2',
    'pydantic>=2.5.0',
    'python-dotenv>=1.2.2',
    'redis>=7.4.0',
    'sqlalchemy>=2.0.49',
    'uvicorn>=0.41.0',
    'config',
]

[tool.uv.sources]
config = { path = '../../../packages/config', editable = true }

[dependency-groups]
dev = [
    'httpx>=0.28.1',
    'pytest>=8.3.0',
    'ruff>=0.12.0',
]


[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
