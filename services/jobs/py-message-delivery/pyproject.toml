[project]
name = 'py-simple-agent-job'
version = '0.1.0'
description = 'Worker that consumes agent messages from RabbitMQ and publishes responses'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = [
    'langgraph>=1.1.4,<2.0.0',
    'langchain-core>=1.0.0',
    'langchain-ollama>=1.0.0',
    'langgraph-checkpoint-postgres>=2.0.0',
    'pika>=1.3.2',
    'psycopg[binary]>=3.2.0',
    'python-dotenv>=1.2.2',
    'infra',
    'config',
]

[tool.uv.sources]
infra = { path = '../../../packages/infra', editable = true }
config = { path = '../../../packages/config', editable = true }


[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.15.20",
]
